[project]
name = "nve-authority-dataset"
version = "0.1.0"
description = "Reproducible controlled synthetic workloads for P2P NVE authority placement research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.scripts]
nve-dataset = "nve_dataset.cli:main"
nve-policy = "nve_policy.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nve_dataset", "nve_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
